<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cacing Kremi - Web Version</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: #1a252f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Comic Sans MS', 'Chalkboard SE', 'Comic Neue', sans-serif;
        }

        #game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            overflow: hidden;
        }

        canvas {
            display: block;
            background-color: #bae591;
        }

        #control-panel {
            width: 512px;
            height: 160px;
            background-color: #2c3e50;
            border-top: 2px solid rgba(255, 255, 255, 0.2);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* D-Pad Layout */
        .dpad {
            position: relative;
            width: 150px;
            height: 150px;
        }

        .btn {
            position: absolute;
            width: 46px;
            height: 46px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #154360;
            display: flex;
            justify-content: center;
            align-items: center;
            outline: none;
        }

        .btn:hover {
            background-color: #2980b9;
        }

        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 #154360;
            background-color: #154360;
        }

        #btn-up { top: 4px; left: 52px; }
        #btn-down { bottom: 4px; left: 52px; }
        #btn-left { top: 52px; left: 4px; }
        #btn-right { top: 52px; right: 4px; }

        .hint-text {
            color: white;
            font-size: 15px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="512" height="512"></canvas>
    <div id="control-panel">
        <div id="hint" class="hint-text">Gunakan D-Pad atau Keyboard (W-A-S-D)</div>
        <div id="dpad" class="dpad" style="display: none;">
            <button class="btn" id="btn-up">▲</button>
            <button class="btn" id="btn-down">▼</button>
            <button class="btn" id="btn-left">◄</button>
            <button class="btn" id="btn-right">►</button>
        </div>
    </div>
</div>

<script>
// --- AUDIO SYNTHESIZER (Web Audio API) ---
const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;

function initAudio() {
    if (!audioCtx) {
        audioCtx = new AudioCtx();
    }
}

function playSound(type) {
    if (!audioCtx) return;
    
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);

    if (type === "eat") {
        osc.type = "sine";
        osc.frequency.setValueAtTime(880, now);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
    } else if (type === "star") {
        osc.type = "sine";
        osc.frequency.setValueAtTime(600, now);
        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.15);
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
    } else if (type === "bomb") {
        const bufferSize = audioCtx.sampleRate * 0.25;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        gain.gain.setValueAtTime(0.3, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
        noise.connect(gain);
        noise.start(now);
    } else if (type === "click") {
        osc.type = "sine";
        osc.frequency.setValueAtTime(400, now);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.03);
        osc.start(now);
        osc.stop(now + 0.03);
    }
}

// --- INITIALIZATION ---
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const WIDTH = 512;
const HEIGHT = 512;

let gameState = "HOME";
let highScore = 0;
let timeCounter = 0;
let shakeAmount = 0;

// UI Elements
const hintEl = document.getElementById("hint");
const dpadEl = document.getElementById("dpad");

// --- CLASSES ---
class Particle {
    constructor(x, y, isExplosion = false, isStar = false) {
        this.x = x;
        this.y = y;
        const angle = Math.random() * Math.PI * 2;
        const speed = isExplosion ? (Math.random() * 5 + 3) : (Math.random() * 4 + 2);
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        this.radius = Math.random() * 5 + 3;

        if (isExplosion) {
            const colors = ["#ff4757", "#ffa502", "#fff200", "#576574"];
            this.color = colors[Math.floor(Math.random() * colors.length)];
            this.lifetime = Math.floor(Math.random() * 20 + 30);
        } else if (isStar) {
            const colors = ["#fff200", "#ffd700", "#ffffff"];
            this.color = colors[Math.floor(Math.random() * colors.length)];
            this.lifetime = Math.floor(Math.random() * 15 + 25);
        } else {
            const colors = ["#ffe66d", "#ff6b6b", "#4ecdc4", "#ff9ff3"];
            this.color = colors[Math.floor(Math.random() * colors.length)];
            this.lifetime = Math.floor(Math.random() * 15 + 20);
        }
        this.maxLife = this.lifetime;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vx *= 0.94;
        this.vy *= 0.94;
        this.vy += 0.1;
        this.lifetime--;
    }

    draw(ctx) {
        if (this.lifetime > 0) {
            ctx.save();
            ctx.globalAlpha = this.lifetime / this.maxLife;
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, Math.max(1, this.radius * (this.lifetime / this.maxLife)), 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }
    }
}

class Bomb {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.radius = 12;
    }

    draw(ctx, time) {
        const glow = Math.sin(time * 0.2) > 0;
        
        // Sumbu Bom
        ctx.strokeStyle = "#e17055";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(this.x, this.y - 12, 6, Math.PI, 1.5 * Math.PI);
        ctx.stroke();

        // Percikan Sumbu
        ctx.fillStyle = glow ? "#fff200" : "#ff4757";
        ctx.beginPath();
        ctx.arc(this.x + 6, this.y - 18, 3, 0, Math.PI * 2);
        ctx.fill();

        // Bodi Bom
        ctx.fillStyle = "#2d3436";
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();

        // Kilau / Highlight
        ctx.fillStyle = "#787878";
        ctx.beginPath();
        ctx.arc(this.x - 3, this.y - 3, 3, 0, Math.PI * 2);
        ctx.fill();

        if (glow) {
            ctx.strokeStyle = "#e74c3c";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.stroke();
        }
    }
}

class BonusStar {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.timer = 300;
    }

    draw(ctx, time) {
        if (this.timer <= 0) return;
        if (this.timer < 90 && Math.floor(this.timer / 10) % 2 === 0) return;

        const scale = 1.0 + Math.sin(time * 0.2) * 0.15;
        const r = 12 * scale;

        ctx.save();
        ctx.fillStyle = "#ffd700";
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 1;
        ctx.beginPath();
        for (let i = 0; i < 5; i++) {
            const angleOuter = i * Math.PI * 2 / 5 - Math.PI / 2;
            const angleInner = angleOuter + Math.PI / 5;
            const x1 = this.x + Math.cos(angleOuter) * r;
            const y1 = this.y + Math.sin(angleOuter) * r;
            const x2 = this.x + Math.cos(angleInner) * (r * 0.5);
            const y2 = this.y + Math.sin(angleInner) * (r * 0.5);

            if (i === 0) ctx.moveTo(x1, y1);
            else ctx.lineTo(x1, y1);
            ctx.lineTo(x2, y2);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
    }
}

// --- GAME MAIN CONTROLLER ---
class SnakeGame {
    constructor() {
        this.reset();
    }

    reset() {
        this.headX = WIDTH / 2;
        this.headY = HEIGHT / 2 + 50;
        this.currentAngle = 0.0;
        this.targetAngle = 0.0;
        this.speed = 3.2;
        this.turnSpeed = 0.12;

        this.segmentDistance = 14;
        this.bodyRadius = 14;
        this.body = [];

        for (let i = 0; i < 12; i++) {
            this.body.push([this.headX - i * this.segmentDistance, this.headY]);
        }

        this.score = 0;
        this.particles = [];
        this.bombs = [];
        this.bonusStar = null;
        this.spawnFood();
        this.updateBombs();
    }

    spawnFood() {
        const margin = 40;
        while (true) {
            const fx = Math.floor(Math.random() * (WIDTH - margin * 2)) + margin;
            const fy = Math.floor(Math.random() * (HEIGHT - margin * 2)) + margin;

            let tooClose = false;
            for (let bomb of this.bombs) {
                if (Math.hypot(fx - bomb.x, fy - bomb.y) < 40) {
                    tooClose = true;
                    break;
                }
            }
            if (!tooClose) {
                this.foodX = fx;
                this.foodY = fy;
                break;
            }
        }
    }

    spawnBonusStar() {
        if (!this.bonusStar && Math.random() < 0.35) {
            const margin = 50;
            const bx = Math.floor(Math.random() * (WIDTH - margin * 2)) + margin;
            const by = Math.floor(Math.random() * (HEIGHT - margin * 2)) + margin;
            this.bonusStar = new BonusStar(bx, by);
        }
    }

    updateBombs() {
        const targetCount = Math.min(1 + Math.floor(this.score / 30), 6);
        while (this.bombs.length < targetCount) {
            const margin = 50;
            const bx = Math.floor(Math.random() * (WIDTH - margin * 2)) + margin;
            const by = Math.floor(Math.random() * (HEIGHT - margin * 2)) + margin;

            if (Math.hypot(bx - this.headX, by - this.headY) > 100 &&
                Math.hypot(bx - this.foodX, by - this.foodY) > 50) {
                this.bombs.push(new Bomb(bx, by));
            }
        }
    }

    setTargetAngle(angle) {
        let diff = (angle - this.currentAngle + Math.PI) % (Math.PI * 2) - Math.PI;
        this.targetAngle = this.currentAngle + diff;
    }

    triggerGameOver() {
        gameState = "GAMEOVER";
        shakeAmount = 15;
        playSound("bomb");
        if (this.score > highScore) highScore = this.score;

        hintEl.style.display = "block";
        dpadEl.style.display = "none";
    }

    update() {
        timeCounter++;
        if (shakeAmount > 0) shakeAmount--;

        if (gameState !== "PLAYING") return;

        const angleDiff = this.targetAngle - this.currentAngle;
        if (Math.abs(angleDiff) > 0.01) {
            this.currentAngle += angleDiff * this.turnSpeed;
        }

        this.headX += Math.cos(this.currentAngle) * this.speed;
        this.headY += Math.sin(this.currentAngle) * this.speed;

        // Nabrak Tembok
        if (this.headX < this.bodyRadius || this.headX > WIDTH - this.bodyRadius ||
            this.headY < this.bodyRadius || this.headY > HEIGHT - this.bodyRadius) {
            this.triggerGameOver();
            return;
        }

        this.body[0] = [this.headX, this.headY];

        for (let i = 1; i < this.body.length; i++) {
            const [prevX, prevY] = this.body[i - 1];
            const [currX, currY] = this.body[i];

            const dx = prevX - currX;
            const dy = prevY - currY;
            const dist = Math.hypot(dx, dy);

            if (dist > 0) {
                const targetX = prevX - (dx / dist) * this.segmentDistance;
                const targetY = prevY - (dy / dist) * this.segmentDistance;
                this.body[i] = [targetX, targetY];
            }
        }

        // Nabrak Buntut Sendiri
        for (let i = 8; i < this.body.length; i++) {
            if (Math.hypot(this.headX - this.body[i][0], this.headY - this.body[i][1]) < this.bodyRadius) {
                this.triggerGameOver();
                return;
            }
        }

        // Kena Bom
        for (let bomb of this.bombs) {
            if (Math.hypot(this.headX - bomb.x, this.headY - bomb.y) < this.bodyRadius + bomb.radius) {
                for (let i = 0; i < 40; i++) {
                    this.particles.push(new Particle(bomb.x, bomb.y, true));
                }
                this.triggerGameOver();
                return;
            }
        }

        // Makan Apel
        if (Math.hypot(this.headX - this.foodX, this.headY - this.foodY) < this.bodyRadius + 12) {
            this.score += 10;
            playSound("eat");

            for (let i = 0; i < 30; i++) {
                this.particles.push(new Particle(this.foodX, this.foodY));
            }

            const [lastX, lastY] = this.body[this.body.length - 1];
            for (let i = 0; i < 3; i++) {
                this.body.push([lastX, lastY]);
            }

            this.updateBombs();
            this.spawnFood();
            this.spawnBonusStar();
        }

        // Makan Bintang
        if (this.bonusStar) {
            this.bonusStar.timer--;
            if (this.bonusStar.timer <= 0) {
                this.bonusStar = null;
            } else if (Math.hypot(this.headX - this.bonusStar.x, this.headY - this.bonusStar.y) < this.bodyRadius + 12) {
                this.score += 30;
                playSound("star");
                for (let i = 0; i < 30; i++) {
                    this.particles.push(new Particle(this.bonusStar.x, this.bonusStar.y, false, true));
                }
                this.bonusStar = null;
            }
        }

        // Update Partikel
        for (let i = this.particles.length - 1; i >= 0; i--) {
            this.particles[i].update();
            if (this.particles[i].lifetime <= 0) {
                this.particles.splice(i, 1);
            }
        }
    }

    drawBoard() {
        const gridSize = 32;
        for (let row = 0; row < HEIGHT / gridSize; row++) {
            for (let col = 0; col < WIDTH / gridSize; col++) {
                ctx.fillStyle = (row + col) % 2 === 0 ? "#bae591" : "#abe082";
                ctx.fillRect(col * gridSize, row * gridSize, gridSize, gridSize);
            }
        }
    }

    drawFood() {
        const bounce = Math.sin(timeCounter * 0.12) * 3;
        const fy = this.foodY + bounce;
        const radius = 12;

        ctx.fillStyle = "#ff6b6b";
        ctx.beginPath();
        ctx.arc(this.foodX, fy, radius, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#ffb4b4";
        ctx.beginPath();
        ctx.arc(this.foodX - 3, fy - 3, 4, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#4ecdc4";
        ctx.beginPath();
        ctx.ellipse(this.foodX + 2, fy - radius - 1, 3.5, 2.5, 0, 0, Math.PI * 2);
        ctx.fill();
    }

    drawSnake() {
        for (let i = this.body.length - 1; i >= 0; i--) {
            const [bx, by] = this.body[i];
            const factor = 1.0 - (i / this.body.length) * 0.4;
            const r = this.bodyRadius * factor;

            if (i === 0) {
                // Kepala Ularnya
                ctx.fillStyle = "#58d68d";
                ctx.beginPath();
                ctx.arc(bx, by, this.bodyRadius + 2, 0, Math.PI * 2);
                ctx.fill();

                // Lidah
                const tongueLen = Math.abs(Math.sin(timeCounter * 0.25)) * 8 + 4;
                const tx = bx + Math.cos(this.currentAngle) * (this.bodyRadius + tongueLen);
                const ty = by + Math.sin(this.currentAngle) * (this.bodyRadius + tongueLen);

                ctx.strokeStyle = "#ff6347";
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(bx, by);
                ctx.lineTo(tx, ty);
                ctx.stroke();

                // Mata & Pipi
                const eyeOffset = 0.5;
                const e1x = bx + Math.cos(this.currentAngle - eyeOffset) * 9;
                const e1y = by + Math.sin(this.currentAngle - eyeOffset) * 9;
                const e2x = bx + Math.cos(this.currentAngle + eyeOffset) * 9;
                const e2y = by + Math.sin(this.currentAngle + eyeOffset) * 9;

                // Blush
                ctx.fillStyle = "#ff8c9d";
                ctx.beginPath();
                ctx.arc(e1x - 2, e1y + 3, 3, 0, Math.PI * 2);
                ctx.arc(e2x + 2, e2y + 3, 3, 0, Math.PI * 2);
                ctx.fill();

                // Pupil Hitam
                ctx.fillStyle = "#141414";
                ctx.beginPath();
                ctx.arc(e1x, e1y, 4, 0, Math.PI * 2);
                ctx.arc(e2x, e2y, 4, 0, Math.PI * 2);
                ctx.fill();

                // Kilau Mata
                ctx.fillStyle = "#ffffff";
                ctx.beginPath();
                ctx.arc(e1x - 1, e1y - 1, 1.5, 0, Math.PI * 2);
                ctx.arc(e2x - 1, e2y - 1, 1.5, 0, Math.PI * 2);
                ctx.fill();

            } else {
                ctx.fillStyle = "#2e8b57";
                ctx.beginPath();
                ctx.arc(bx, by, Math.max(r, 4), 0, Math.PI * 2);
                ctx.fill();
            }
        }
    }

    drawHUD() {
        ctx.font = "bold 22px 'Comic Sans MS'";
        ctx.fillStyle = "#2c3e50";
        ctx.textAlign = "left";
        ctx.fillText(`🍎 Skor: ${this.score}`, 15, 30);

        ctx.textAlign = "right";
        ctx.fillText(`🏆 Terbaik: ${highScore}`, WIDTH - 15, 30);
    }

    drawHomeScreen() {
        this.drawBoard();
        const bounce = Math.sin(timeCounter * 0.08) * 5;

        ctx.font = "bold 40px 'Comic Sans MS'";
        ctx.fillStyle = "#2c3e50";
        ctx.textAlign = "center";
        ctx.fillText("Ular Smooth 🐍", WIDTH / 2, HEIGHT / 4 + bounce);

        // Preview Ular di Menu Utama
        const cx = WIDTH / 2, cy = HEIGHT / 2 - 20;
        ctx.fillStyle = "#58d68d";
        ctx.beginPath(); ctx.arc(cx, cy, 32, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#ff8c9d";
        ctx.beginPath(); ctx.arc(cx - 16, cy + 6, 6, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx + 16, cy + 6, 6, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = "#141414";
        ctx.beginPath(); ctx.arc(cx - 10, cy - 6, 5, 0, Math.PI * 2); ctx.fill();
        ctx.beginPath(); ctx.arc(cx + 10, cy - 6, 5, 0, Math.PI * 2); ctx.fill();

        // Tombol Mulai
        ctx.fillStyle = "#3498db";
        ctx.beginPath();
        ctx.roundRect(WIDTH / 2 - 100, HEIGHT / 2 + 30, 200, 50, 12);
        ctx.fill();

        ctx.font = "bold 22px 'Comic Sans MS'";
        ctx.fillStyle = "#ffffff";
        ctx.fillText("MULAI MAIN", WIDTH / 2, HEIGHT / 2 + 62);
    }

    drawGameOverScreen() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.65)";
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        ctx.textAlign = "center";
        ctx.font = "bold 40px 'Comic Sans MS'";
        ctx.fillStyle = "#ff6b6b";
        ctx.fillText("Kena Bom / Nabrak! 💥", WIDTH / 2, HEIGHT / 3 - 20);

        ctx.font = "bold 22px 'Comic Sans MS'";
        ctx.fillStyle = "#ffffff";
        ctx.fillText(`Skor Kamu: ${this.score}`, WIDTH / 2, HEIGHT / 2 - 20);

        ctx.fillStyle = "#ffe66d";
        ctx.fillText(`Skor Terbaik: ${highScore}`, WIDTH / 2, HEIGHT / 2 + 20);

        ctx.font = "bold 15px 'Comic Sans MS'";
        ctx.fillStyle = "#ffffff";
        ctx.fillText("Klik Layar untuk Main Lagi", WIDTH / 2, HEIGHT / 2 + 70);
    }

    draw() {
        ctx.save();

        if (shakeAmount > 0) {
            const rx = (Math.random() * 2 - 1) * shakeAmount;
            const ry = (Math.random() * 2 - 1) * shakeAmount;
            ctx.translate(rx, ry);
        }

        if (gameState === "HOME") {
            this.drawHomeScreen();
        } else {
            this.drawBoard();
            for (let bomb of this.bombs) bomb.draw(ctx, timeCounter);
            this.drawFood();
            if (this.bonusStar) this.bonusStar.draw(ctx, timeCounter);
            this.drawSnake();
            for (let p of this.particles) p.draw(ctx);
            this.drawHUD();

            if (gameState === "GAMEOVER") {
                this.drawGameOverScreen();
            }
        }

        ctx.restore();
    }
}

const game = new SnakeGame();

// --- CONTROLS & EVENTS ---
function startGame() {
    initAudio();
    game.reset();
    gameState = "PLAYING";
    playSound("click");
    hintEl.style.display = "none";
    dpadEl.style.display = "block";
}

canvas.addEventListener("click", (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    if (gameState === "HOME") {
        if (x >= WIDTH / 2 - 100 && x <= WIDTH / 2 + 100 &&
            y >= HEIGHT / 2 + 30 && y <= HEIGHT / 2 + 80) {
            startGame();
        }
    } else if (gameState === "GAMEOVER") {
        startGame();
    }
});

// Controls Keyboard
window.addEventListener("keydown", (e) => {
    initAudio();
    if (gameState === "HOME" || gameState === "GAMEOVER") {
        if (e.code === "Space" || e.code === "Enter") {
            startGame();
        }
    } else if (gameState === "PLAYING") {
        switch (e.key.toLowerCase()) {
            case "arrowup": case "w": game.setTargetAngle(-Math.PI / 2); break;
            case "arrowdown": case "s": game.setTargetAngle(Math.PI / 2); break;
            case "arrowleft": case "a": game.setTargetAngle(Math.PI); break;
            case "arrowright": case "d": game.setTargetAngle(0.0); break;
        }
    }
});

// Controls On-Screen D-Pad Buttons
const bindButton = (id, angle) => {
    const btn = document.getElementById(id);
    const trigger = (e) => {
        e.preventDefault();
        initAudio();
        if (gameState === "PLAYING") {
            game.setTargetAngle(angle);
            playSound("click");
        }
    };
    btn.addEventListener("mousedown", trigger);
    btn.addEventListener("touchstart", trigger);
};

bindButton("btn-up", -Math.PI / 2);
bindButton("btn-down", Math.PI / 2);
bindButton("btn-left", Math.PI);
bindButton("btn-right", 0.0);

// --- MAIN LOOP ---
function loop() {
    game.update();
    game.draw();
    requestAnimationFrame(loop);
}

loop();
</script>
</body>
